name: Weekly image security scan

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan published main image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pull published image
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:main"
          docker pull "$image"
          echo "ref=$image" >> "$GITHUB_OUTPUT"
      - name: Scan published image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DISABLE_TELEMETRY: "true"
          TRIVY_OFFLINE_SCAN: "true"
          TRIVY_IMAGE_SRC: docker
        with:
          version: v0.70.0
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln
          vuln-type: os,library
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          exit-code: "1"
