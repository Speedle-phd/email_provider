name: CI/CD

on:
  push:
    branches: [main]
    # Docs and Dependabot config do not change the image; skip rebuild and redeploy.
    paths-ignore:
      - "**.md"
      - ".github/dependabot.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tool images (Trivy, actionlint) are pinned in this file, which Dependabot updates.
  TOOLS: .github/compose.tools.yaml

jobs:
  # Blocks pull requests that add dependencies with known HIGH/CRITICAL vulnerabilities.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  lint:
    name: Lint Python, workflows, and deploy script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hash-locked lint tools
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet --require-hashes -r requirements-lint.txt
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"
      - name: Ruff
        run: |
          ruff check --output-format=github .
          ruff format --check .
      # Online mode (token) enables the audits that check pinned SHAs really belong
      # to the action's repository (impostor-commit) and flag known-vulnerable actions.
      - name: Workflow security (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .github/workflows
      - name: Workflow syntax (actionlint) and deploy script (shellcheck)
        run: |
          docker compose -f "$TOOLS" run --rm -T -v "$PWD:/repo:ro" -w /repo actionlint -color
          docker compose -f "$TOOLS" run --rm -T -v "$PWD:/repo:ro" -w /repo \
            --entrypoint shellcheck actionlint deploy/deploy.sh

  checks:
    name: Production image, tests, and startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_IMAGE: email-provider-ci
      APP_TAG: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create test-only configuration
        run: |
          cp .env.example .env
          cp .notification.env.example .notification.env
      - name: Validate production and development Compose
        run: |
          bash -n deploy/deploy.sh
          docker compose config --quiet
          docker compose -f docker-compose.yaml -f docker-compose.dev.yaml config --quiet
          docker compose -f "$TOOLS" config --quiet
      - name: Build production image
        run: |
          docker build --platform linux/amd64 -t "$APP_IMAGE:$APP_TAG" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Run tests with the production runtime and dependencies
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            --mount "type=bind,source=$PWD/test_app.py,target=/app/test_app.py,readonly" \
            "$APP_IMAGE:$APP_TAG" python -B -m unittest -v test_app
      - name: Verify healthy production startup
        run: |
          docker compose up -d --no-build --pull never --wait --wait-timeout 120
          curl --fail --silent --show-error http://127.0.0.1:8085/health
      - name: Diagnostics and cleanup
        if: always()
        run: |
          docker compose ps
          docker compose logs --tail 40
          docker compose down
      - name: Export tested image
        run: docker save --output "$RUNNER_TEMP/email-provider-image.tar" "$APP_IMAGE:$APP_TAG"
      # Informational: the weekly security workflow reports to the Security tab
      # and fails on fixable HIGH/CRITICAL findings.
      - name: Vulnerability report (non-blocking)
        continue-on-error: true
        run: |
          docker compose -f "$TOOLS" run --rm -T -v "$RUNNER_TEMP:/scan:ro" trivy \
            image --input /scan/email-provider-image.tar \
            --scanners vuln --severity HIGH,CRITICAL --no-progress --exit-code 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-production-image
          path: ${{ runner.temp }}/email-provider-image.tar
          if-no-files-found: error
          retention-days: 1

  images:
    name: Publish production image
    needs: [lint, checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-production-image
          path: ${{ runner.temp }}
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image (no rebuild)
        id: push
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: |
          docker load --input "$RUNNER_TEMP/email-provider-image.tar"
          docker tag email-provider-ci:test "$IMAGE:$GITHUB_SHA"
          docker tag email-provider-ci:test "$IMAGE:main"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:main"
          digest="$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Unexpected digest: $digest"; exit 1; }
          echo "Published $IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy to server
    needs: [images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy tested commit by image digest
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DIGEST: ${{ needs.images.outputs.digest }}
        run: |
          : "${SSH_HOST:?Set SSH_HOST}"
          : "${SSH_PRIVATE_KEY:?Set SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Set SSH_KNOWN_HOSTS}"
          : "${DIGEST:?Missing image digest}"
          install -m 700 -d ~/.ssh
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p 22 -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "deploy@$SSH_HOST" "$GITHUB_SHA $DIGEST"
