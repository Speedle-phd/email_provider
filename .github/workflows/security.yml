name: Image security scan

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Trivy image is pinned in this file, which Dependabot updates.
  TOOLS: .github/compose.tools.yaml

jobs:
  scan:
    name: Scan published main image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and export published image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:main"
          docker pull --quiet "$image"
          mkdir -p "$RUNNER_TEMP/scan"
          docker save --output "$RUNNER_TEMP/scan/image.tar" "$image"
      - name: Report all findings to the Security tab
        run: |
          docker compose -f "$TOOLS" run --rm -T -v "$RUNNER_TEMP/scan:/scan" trivy \
            image --input /scan/image.tar --scanners vuln \
            --format sarif --output /scan/trivy.sarif --no-progress
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: ${{ runner.temp }}/scan/trivy.sarif
          category: trivy-image
      # A failed run triggers GitHub's failure notification when action is possible.
      - name: Fail on fixable HIGH or CRITICAL vulnerabilities
        run: |
          docker compose -f "$TOOLS" run --rm -T -v "$RUNNER_TEMP/scan:/scan:ro" trivy \
            image --input /scan/image.tar --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --no-progress --exit-code 1
