services:
  email:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8085:8085"
    env_file:
      - .env
      - .notification.env
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    restart: unless-stopped